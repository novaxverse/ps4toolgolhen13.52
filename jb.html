<!doctype html>
<html lang="es" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NovaXVerse | GoldHen PS4 13.02 - 13.52</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: linear-gradient(180deg, #03060d 0%, #06111f 55%, #03060d 100%);
        background-attachment: fixed;
        color: #c8ced8;
        font:
          15px/1.45 "Segoe UI",
          system-ui,
          sans-serif;
      }
      a {
        color: #d9e8f5;
      }
      /* ===== FONDO GALAXIA: estrellas estáticas (muy ligeras) ===== */
      body::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 0;
        pointer-events: none;
        background-image:
          radial-gradient(1.8px 1.8px at 22px 32px,   rgba(255,255,255,.85), transparent 55%),
          radial-gradient(1.2px 1.2px at 96px 18px,   rgba(255,255,255,.60), transparent 55%),
          radial-gradient(2.2px 2.2px at 150px 140px, rgba(180,220,255,.80), transparent 55%),
          radial-gradient(1px   1px   at 44px 110px,  rgba(255,255,255,.45), transparent 55%),
          radial-gradient(1.5px 1.5px at 190px 64px,  rgba(255,255,255,.90), transparent 55%),
          radial-gradient(1px   1px   at 250px 160px, rgba(255,255,255,.40), transparent 55%),
          radial-gradient(1.5px 1.5px at 30px 220px,  rgba(255,220,150,.70), transparent 55%),
          radial-gradient(1px   1px   at 300px 250px, rgba(255,255,255,.50), transparent 55%),
          radial-gradient(1.3px 1.3px at 120px 40px,  rgba(255,255,255,.70), transparent 55%),
          radial-gradient(1px   1px   at 210px 130px, rgba(150,200,255,.50), transparent 55%),
          radial-gradient(1.6px 1.6px at 60px 180px,  rgba(255,255,255,.80), transparent 55%),
          radial-gradient(1px   1px   at 170px 90px,  rgba(255,255,255,.50), transparent 55%),
          radial-gradient(1.2px 1.2px at 280px 60px,  rgba(255,255,255,.60), transparent 55%),
          radial-gradient(1.9px 1.9px at 100px 240px, rgba(255,200,120,.55), transparent 55%),
          radial-gradient(1px   1px   at 230px 200px, rgba(255,255,255,.45), transparent 55%),
          radial-gradient(1.1px 1.1px at 320px 120px, rgba(220,240,255,.75), transparent 55%),
          radial-gradient(1.4px 1.4px at 60px 280px,  rgba(255,255,255,.65), transparent 55%),
          radial-gradient(1px   1px   at 140px 330px, rgba(255,255,255,.45), transparent 55%),
          radial-gradient(1.7px 1.7px at 260px 30px,  rgba(180,220,255,.75), transparent 55%),
          radial-gradient(1px   1px   at 320px 210px, rgba(255,255,255,.50), transparent 55%),
          radial-gradient(1.3px 1.3px at 40px 150px,  rgba(255,220,150,.60), transparent 55%),
          radial-gradient(1px   1px   at 200px 290px, rgba(255,255,255,.40), transparent 55%),
          radial-gradient(1.5px 1.5px at 110px 70px,  rgba(255,255,255,.80), transparent 55%),
          radial-gradient(1px   1px   at 290px 130px, rgba(200,230,255,.55), transparent 55%);
        background-size: 170px 160px, 140px 150px, 150px 130px, 110px 120px,
                         180px 140px, 130px 110px, 160px 180px, 190px 150px,
                         125px 100px, 150px 170px, 175px 125px, 120px 160px,
                         155px 135px, 135px 150px, 190px 130px, 110px 140px,
                         130px 150px, 160px 120px, 170px 150px, 180px 160px,
                         140px 130px, 190px 170px, 150px 140px, 170px 180px;
      }
      #brand {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 16px;
        background: linear-gradient(160deg, #0b1826, #04101c);
        border-bottom: 2px solid #2a5a80;
        box-shadow: 0 0 18px rgba(0, 120, 255, 0.14);
      }
      #brand a {
        text-decoration: none;
      }
      #brand img {
        display: block;
        margin: 0 auto 4px;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        box-shadow: 0 0 20px rgba(255, 189, 0, 0.4);
      }
      #brand b {
        display: block;
        font-family: 'Bebas Neue', Arial, Helvetica, sans-serif;
        font-size: 36px;
        font-weight: 400;
        letter-spacing: 0.12em;
        color: #ffbd00;
        text-shadow: 0 0 14px rgba(255, 189, 0, 0.4);
      }
      #brand .sub {
        display: inline-block;
        margin-top: 6px;
        font-family: 'Bebas Neue', Arial, Helvetica, sans-serif;
        font-size: 23px;
        font-weight: 400;
        letter-spacing: 0.14em;
        line-height: 1;
        color: #0b0f14;
        background: linear-gradient(145deg, #ffd226, #f0a900);
        border-radius: 999px;
        padding: 6px 18px 7px;
        box-shadow: 0 0 16px rgba(255, 189, 0, 0.55);
        animation: subpulse 1.6s ease-in-out infinite;
      }
      @keyframes subpulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.07); box-shadow: 0 0 26px rgba(255, 189, 0, 0.9); }
      }

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid #2a5a80;
        border-top-color: #ffbd00;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        z-index: 2;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-family: 'Bebas Neue', Arial, Helvetica, sans-serif;
        font-size: 34px;
        letter-spacing: 2px;
        color: #ff6b5e;
        text-shadow: 0 0 18px rgba(255, 107, 94, 0.8), 0 0 6px rgba(255, 107, 94, 0.6);
        display: none;
        z-index: 2;
        animation: boom 0.45s 0.15s both, glow 1.2s ease-in-out infinite;
      }
      #done {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-family: 'Bebas Neue', Arial, Helvetica, sans-serif;
        font-size: 40px;
        letter-spacing: 2px;
        color: #7fd0a0;
        text-shadow: 0 0 20px rgba(127, 208, 160, 0.85), 0 0 6px rgba(127, 208, 160, 0.6);
        display: none;
        z-index: 2;
        animation: boom 0.45s 0.15s both, glow 1.2s ease-in-out infinite;
      }
      @keyframes boom {
        0% { transform: translateY(-50%) scale(0.82); opacity: 0.2; }
        60% { transform: translateY(-50%) scale(1.05); }
        100% { transform: translateY(-50%) scale(1); opacity: 1; }
      }
      @keyframes glow {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.4); }
      }
      #wrap {
        padding: 0;
        position: relative;
        z-index: 1;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.done #done {
        display: block;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg,
      body.log #done {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-family: 'Bebas Neue', Arial, Helvetica, sans-serif;
        font-size: 26px;
        font-weight: 400;
        letter-spacing: 1px;
        color: #eef4fa;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: rgba(3, 10, 16, 0.55);
        border: 1px solid #2a5a80;
        border-radius: 8px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
        color: #9fb3d0;
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #ff6b5e;
      }
      .warn {
        color: #ffcf4d;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #ff6b5e;
      }
      code {
        color: #9fb3d0;
      }
      #foot {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 6px;
        text-align: center;
        font-size: 14px;
        color: #5c6672;
        letter-spacing: 0.06em;
        pointer-events: none;
        line-height: 1.6;
        z-index: 2;
      }
      #foot b {
        color: #9fb3d0;
        font-weight: 600;
      }
      #foot a {
        color: #ffbd00;
        text-decoration: none;
        pointer-events: auto;
      }
      #foot .hint {
        color: #4c5560;
        font-style: italic;
        margin-left: 4px;
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <a href="https://nxvtools.novaxverse.workers.dev/" target="_blank" rel="noopener">
        <img src="logo9.png" alt="NovaXVerse" width="100" height="100" /><b>13.02 - 13.04 - 13.50 - 13.52</b><span class="sub">GoldHen v2.4b18.12</span>
      </a>
    </div>
    <div id="spin"></div>
    <div id="msg">Reinicia tu consola</div>
    <div id="done">GOLDHEN CARGADO ✓ YA PUEDES CERRAR</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
    <div id="foot">
      <b>NOVAXVERSE</b> &middot;
      <a href="https://nxvtools.novaxverse.workers.dev/" target="_blank" rel="noopener">Central Tools PS4</a>
    </div>
  </body>
</html>
